name: daily-prices
on:
  schedule:
    - cron: "5 11 * * 1-5"   # 7:05 AM ET (EDT) / 6:05 AM ET (EST)
    - cron: "30 21 * * 1-5"  # 5:30 PM ET (EDT) / 4:30 PM ET (EST), after the close in both seasons
    - cron: "35 13 * * 1-5"  # v2: second morning run (8:35 AM EST), in case the first one is late
    - cron: "40 19 * * 1-5"  # v2: market-hours run (2:40 PM EST) for live option quotes before the 3:27 check
    - cron: "30 23 * * 1-5"  # v2: late rerun so the day's final bars are in
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: repo-writes
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python fetch_prices.py
      - name: AI scan (fundamentals refresh on the morning run, reused after the close)
        run: python fetch_ai.py
        continue-on-error: true
        timeout-minutes: 15
      - name: Option chains (v2, quotes only overwrite when Yahoo shows a live bid)
        run: python fetch_chains.py
        continue-on-error: true
        timeout-minutes: 10
      - name: History (Friday after-close run and manual runs)
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '30 21 * * 1-5'
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$(date -u +%u)" = "5" ]; then
            python fetch_history.py --years 5
          fi
      - name: Commit snapshot
        run: |
          git config user.name "helio-desk-bot"
          git config user.email "helio-desk-bot@users.noreply.github.com"
          git add data/prices.json data/ai_scan.json data/chains.json history/ 2>/dev/null || git add data/prices.json
          git diff --cached --quiet && exit 0
          git commit -m "prices $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
